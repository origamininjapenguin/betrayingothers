function sfx(k){if(!ready||!sfxOn||!sy.ns)return;const n=Tone.now();try{(({move:()=>sy.ns.triggerAttackRelease('16n'),discover:()=>{sy.cr.triggerAttackRelease('C2','4n',n);sy.cr.setNote('G1',n+.3)},event:()=>{sy.bell.triggerAttackRelease('C4','8n',n);sy.bell.triggerAttackRelease('F#4','8n',n+.1)},item:()=>{sy.bell.triggerAttackRelease('E5','16n',n);sy.bell.triggerAttackRelease('B5','8n',n+.1)},omen:()=>{sy.mem.triggerAttackRelease('A0','2n',n);sy.bell.triggerAttackRelease('G#3','2n',n+.2)},roll:()=>{for(let i=0;i<6;i++)sy.ns.triggerAttackRelease('32n',n+i*.12+Math.random()*.04)},room:()=>sy.bell.triggerAttackRelease('A3','8n',n),trade:()=>sy.bell.triggerAttackRelease('D5','16n',n),haunt:()=>{sy.mem.triggerAttackRelease('C1','1n',n);sy.cr.triggerAttackRelease('C1','1n',n);sy.bell.triggerAttackRelease('F#2','1n',n+.3);haunted()},hit:()=>{sy.ns.triggerAttackRelease('8n');sy.mem.triggerAttackRelease('E1','16n',n)},death:()=>{sy.mem.triggerAttackRelease('C0','1n',n);sy.cr.triggerAttackRelease('A1','1n',n)},win:()=>{sy.bell.triggerAttackRelease('C5','2n',n);sy.bell.triggerAttackRelease('G5','2n',n+.3)}})[k]||(()=>0))()}catch(e){}}
function music(on){if(!on){Tone.Transport.stop();return}Tone.start().then(()=>{ready=true;initA();if(!loop){const ch=[['A2','C3','E3'],['F2','A2','C3'],['D2','F2','A2'],['E2','G#2','B2']];let i=0;loop=new Tone.Loop(t=>syn.triggerAttackRelease(ch[i++%4],'4m',t),'4m').start(0);hb=new Tone.Loop(t=>{sy.mem.triggerAttackRelease('C1','16n',t);sy.mem.triggerAttackRelease('C1','16n',t+.25)},'1n');Tone.Transport.bpm.value=50}Tone.Transport.start();if(S&&S.haunt)haunted()})}
function haunted(){if(hb&&hb.state!='started'){hb.start(0);Tone.Transport.bpm.value=70}}
</script></body></html>
